name: Keep Streamlit App Awake

on:
  schedule:
    # Run every 4 hours (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Streamlit Application URL'
        required: false
        default: 'https://krishnidhi.streamlit.app/'
        type: string

concurrency:
  group: streamlit-keep-alive
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping-and-wake:
    name: Ping & Wake Streamlit App
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Ping and Wake Streamlit App
        env:
          STREAMLIT_APP_URL: ${{ inputs.app_url || vars.STREAMLIT_APP_URL || secrets.STREAMLIT_APP_URL || 'https://krishnidhi.streamlit.app/' }}
        run: |
          python .github/scripts/keep_alive.py --url "$STREAMLIT_APP_URL"

      - name: Verify Application HTTP Reachability
        if: always()
        run: |
          python -c "
          import urllib.request
          url = '${{ inputs.app_url || 'https://krishnidhi.streamlit.app/' }}'
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              resp = urllib.request.urlopen(req, timeout=15)
              print(f'HTTP Reachability Check: {resp.status} OK at {url}')
          except Exception as e:
              print(f'HTTP Reachability Check Notice: {e}')
          "

